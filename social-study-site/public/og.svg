<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2EAE2"/>
      <stop offset="1" stop-color="#fbf4ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Frame -->
  <rect x="60" y="60" width="1080" height="510" rx="34" fill="#ffffff" stroke="#000000" stroke-width="6" filter="url(#shadow)"/>

  <!-- Accent dots -->
  <circle cx="118" cy="118" r="10" fill="#2A5D67"/>
  <circle cx="150" cy="118" r="10" fill="#D7795D"/>
  <circle cx="182" cy="118" r="10" fill="#C89F56"/>

  <!-- Logo (rasterized into final PNG during build) -->
  <image x="130" y="180" width="240" height="240" href="file:///Users/ericgagnon/.openclaw/workspace/social-study-site/public/brand/LogoNoBackground.png"/>

  <!-- Text -->
  <text x="420" y="250" font-family="Baloo 2, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="72" font-weight="800" fill="#0f172a">
    The Social Study
  </text>

  <text x="420" y="330" font-family="Patrick Hand, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="54" font-weight="400" fill="#3B2F2F">
    Drink smarter, not harder
  </text>

  <text x="420" y="395" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="26" fill="#334155">
    Lectures in bars and breweries • Speaker Q&A newsletter
  </text>

  <!-- Footer URL -->
  <text x="130" y="525" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="22" fill="#475569">
    www.thesocial.study
  </text>
</svg>
